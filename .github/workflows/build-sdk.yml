name: Build and publish SDK binaries

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sdk-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SDK_VERSION: 1.0.${{ github.run_number }}
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
      - name: Install Android platform and native toolchain
        run: sdkmanager 'platforms;android-37.0' 'ndk;26.1.10909125'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Check SDK structure
        run: python3 scripts/check_sdk_structure.py
      - name: Test and compile all published targets
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 -PsdkVersion="$SDK_VERSION" \
            :sdk:compileCommonMainKotlinMetadata :sdk:testAndroidHostTest :sdk:iosSimulatorArm64Test \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            :sdk:linkDebugFrameworkIosArm64 :sdk:publishAllPublicationsToStagingRepository
      - name: Verify and package Maven repository
        run: |
          python3 scripts/package_sdk.py --repository build/maven-repository \
            --coordinate 'com.anto426.liquidmonet:sdk' --version "$SDK_VERSION" \
            --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdk-diagnostics-${{ github.run_id }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish Maven packages for Gradle
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon --max-workers=2 -PsdkVersion="$SDK_VERSION" \
            :sdk:publishAllPublicationsToGitHubPackagesRepository
      - name: Publish immutable SDK release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          Path('release-notes.md').write_text(
              'Precompiled Kotlin Multiplatform SDK: Android AAR, metadata and iOS KLIBs.\n\n'
              'Coordinate: `com.anto426.liquidmonet:sdk:' + os.environ['SDK_VERSION'] + '`\n\n'
              'Source: ' + os.environ['GITHUB_SHA'] + '\n'
          )
          PYTHON
          tag="v$SDK_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; its binaries will not be overwritten."
            exit 0
          fi
          gh release create "$tag" build/maven-repository.zip build/maven-repository.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SDK $SDK_VERSION" --notes-file release-notes.md --latest
